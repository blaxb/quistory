{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quistory</title>

  <!-- Optional styling; safe to keep -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    body { background:#f8f9fa; }
    .navbar-brand img { height:28px; vertical-align:middle; margin-right:.4rem; }
    .container-narrow { max-width: 900px; margin: 24px auto; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-sm navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/quiz/">
        <img src="{% static 'frontend/images/qulogo.png' %}" alt="Quistory" />
        Quistory
      </a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/quiz/">Quiz</a></li>
        <li class="nav-item"><a class="nav-link" href="/leaderboard/">Leaderboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/login/">Log in</a></li>
        <li class="nav-item"><a class="nav-link" href="/register/">Create account</a></li>
      </ul>
    </div>
  </nav>

  <main class="container-narrow">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
