{% extends "frontend/base.html" %}
{% load static %}

{% block content %}
<div class="container" style="max-width: 780px; margin: 20px auto;">
  <h2>Generate a Quiz</h2>

  <form method="post" style="margin-bottom:1rem;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Load Quiz</button>
  </form>

  {% if quiz %}
  <hr>
  <h3>{{ quiz.topic|default:""|title }} Quiz</h3>

  <!-- expose quiz data to JS -->
  {{ quiz|json_script:"quiz-data" }}

  <div id="quiz-ui" style="margin-top: 10px;">
    <div style="margin: .5rem 0;">
      <strong>Found:</strong> <span id="found-count">0</span> / <span id="total-count">0</span>
      &nbsp;|&nbsp; <strong>Percent:</strong> <span id="percent">0%</span>
    </div>

    <input id="guess-input" type="text" placeholder="Type your guess..." style="width: 60%; padding: .4rem;" />
    <button id="guess-btn" type="button">Guess</button>
    <button id="giveup-btn" type="button">Give Up</button>

    <ul id="answers" style="margin-top: 1rem;"></ul>

    <div id="save-status" style="margin-top: .5rem; color: #888;"></div>
  </div>
  {% endif %}
</div>

<script>
  // --- auth helpers ----------------------------------------------------------
  function getAccessToken() {
    return (
      (typeof window !== "undefined" && window.API_TOKEN) ||
      localStorage.getItem("access") ||
      localStorage.getItem("access_token") ||
      localStorage.getItem("accessToken") ||
      localStorage.getItem("jwt_access") ||
      null
    );
  }

  function authHeaders() {
    const h = { "Content-Type": "application/json" };
    const tok = getAccessToken();
    if (tok) h["Authorization"] = `Bearer ${tok}`;
    return h;
  }

  async function saveAttempt(payload) {
    try {
      const r = await fetch("/api/quiz/attempts/", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify(payload),
      });
      if (!r.ok) {
        const t = await r.text();
        throw new Error(`${r.status} ${t}`);
      }
      document.getElementById("save-status").textContent =
        getAccessToken()
          ? "Saved! Your leaderboard will reflect this score shortly."
          : "Saved (anonymous). Log in for your score to appear on the leaderboard.";
    } catch (err) {
      console.error("saveAttempt failed:", err);
      document.getElementById("save-status").textContent =
        "Could not save result. Check console/network tab.";
    }
  }

  // --- quiz UI ---------------------------------------------------------------
  (function init() {
    const dataEl = document.getElementById("quiz-data");
    if (!dataEl) return;

    // NOTE: removed JSDoc with `{{ }}` to avoid Django template parsing
    const quiz = JSON.parse(dataEl.textContent);

    const total = quiz.items.length;
    const normalized = new Map();
    quiz.items.forEach((s) => normalized.set(norm(s), s));

    const foundSet = new Set();
    const answersEl = document.getElementById("answers");
    const foundCountEl = document.getElementById("found-count");
    const totalCountEl = document.getElementById("total-count");
    const percentEl = document.getElementById("percent");
    const inputEl = document.getElementById("guess-input");
    const guessBtn = document.getElementById("guess-btn");
    const giveUpBtn = document.getElementById("giveup-btn");

    totalCountEl.textContent = total;

    function norm(s) { return (s || "").toString().trim().toLowerCase(); }

    function renderList() {
      answersEl.innerHTML = "";
      const arr = Array.from(foundSet).sort((a, b) => a.localeCompare(b));
      for (const a of arr) {
        const li = document.createElement("li");
        li.textContent = a;
        answersEl.appendChild(li);
      }
      foundCountEl.textContent = foundSet.size;
      const pct = total ? Math.round((foundSet.size / total) * 100) : 0;
      percentEl.textContent = pct + "%";
    }

    function finished(kind) {
      const pct = total ? Math.round((foundSet.size / total) * 100) : 0;
      saveAttempt({
        topic: quiz.topic || "",
        percent_correct: pct,
        points: foundSet.size,
      });
      inputEl.disabled = true;
      guessBtn.disabled = true;
      giveUpBtn.disabled = true;
    }

    function onGuess() {
      const g = norm(inputEl.value);
      if (!g) return;
      if (normalized.has(g)) {
        const original = normalized.get(g);
        if (!foundSet.has(original)) {
          foundSet.add(original);
          renderList();
          if (foundSet.size === total) finished("complete");
        }
      }
      inputEl.value = "";
      inputEl.focus();
    }

    guessBtn.addEventListener("click", onGuess);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); onGuess(); }
    });
    giveUpBtn.addEventListener("click", () => finished("giveup"));

    renderList();
    inputEl.focus();
  })();
</script>
{% endblock %}
